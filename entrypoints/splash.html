<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anubis Agent</title>
  <link rel="stylesheet" href="/splash.css" />
</head>
<body>
<canvas id="c"></canvas>
<div id="wrap">
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <rect width="128" height="128" rx="24" fill="#0a0a0a"/>
      <circle cx="64" cy="64" r="56" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
      <circle cx="64" cy="64" r="44" fill="#d4af3715"/>
      <path d="M64 12 L82 48 L64 42 L46 48 Z" fill="url(#g1)"/>
      <path d="M64 42 L82 48 L76 88 L64 96 L52 88 L46 48 Z" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
      <path d="M46 48 L32 66 L52 88" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>
      <path d="M82 48 L96 66 L76 88" stroke="url(#g1)" stroke-width="1.5" opacity="0.6"/>
      <line x1="64" y1="42" x2="64" y2="88" stroke="url(#g1)" stroke-width="1" opacity="0.3"/>
      <circle cx="64" cy="64" r="7" fill="#d4af37"/>
      <circle cx="64" cy="64" r="3" fill="#ffffff" opacity="0.9"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
          <stop stop-color="#d4af37"/>
          <stop offset="0.5" stop-color="#ffd700"/>
          <stop offset="1" stop-color="#b8860b"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="title-row">
    <span id="typed"></span><span id="cursor"></span>
  </div>
  <hr id="rule">
  <button id="btn">OPEN PANEL</button>
</div>
<script src="/splash.js"></script>
</body>
</html>
